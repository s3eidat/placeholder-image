<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Placeholder Image — Free Placeholder Image Generator (PNG, JPG, WebP, SVG) | S3eidat Tools</title>
<meta name="description" content="Generate placeholder images of any size with your own colours and text. PNG, JPG, WebP or SVG, common size presets, download or copy as a data URI. Free, private, runs in your browser.">
<meta property="og:title" content="Placeholder Image — free, private placeholder generator">
<meta property="og:description" content="Placeholder images of any size in PNG, JPG, WebP or SVG. Runs 100% in your browser.">
<meta property="og:image" content="screenshot.png">
<link rel="icon" href="kit/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="app.css">
<script src="kit/kit.js"></script>
</head>
<body data-tool="placeholder-image">
<main class="s3-main">
  <section class="s3-hero">
    <h1>Placeholder Image</h1>
    <p>Placeholder images of any size, in your colours, with your text. PNG, JPG, WebP or SVG. Made on your device, nothing uploaded.</p>
  </section>

  <div class="ph-grid">
    <section class="card stack">
      <h2>Settings</h2>
      <label class="field">Preset
        <select class="select" id="preset">
          <option value="">Custom size</option>
        </select>
      </label>
      <div class="row ph-dims">
        <label class="field grow">Width (px)<input class="input" id="w" type="number" min="1" max="8000" value="1200" inputmode="numeric"></label>
        <button class="btn icon ph-swap" id="swap" title="Swap width and height" aria-label="Swap width and height"><svg class="i"><use href="#i-refresh"/></svg></button>
        <label class="field grow">Height (px)<input class="input" id="h" type="number" min="1" max="8000" value="630" inputmode="numeric"></label>
      </div>
      <div class="row">
        <label class="field grow">Background
          <span class="row ph-color"><input type="color" id="bg" value="#1f2937" aria-label="Background colour picker"><input class="input mono" id="bgHex" value="#1f2937" spellcheck="false" aria-label="Background colour hex"></span>
        </label>
        <label class="field grow">Text colour
          <span class="row ph-color"><input type="color" id="fg" value="#9ca3af" aria-label="Text colour picker"><input class="input mono" id="fgHex" value="#9ca3af" spellcheck="false" aria-label="Text colour hex"></span>
        </label>
      </div>
      <label class="field"><span>Text <span class="faint">(empty = width × height, \n = new line)</span></span>
        <input class="input" id="text" dir="auto" placeholder="1200 × 630" maxlength="120">
      </label>
      <div class="row">
        <label class="field grow"><span>Font size <span class="faint" id="fsLbl">auto</span></span>
          <input type="range" id="fs" min="0" max="400" value="0" aria-describedby="fsLbl">
        </label>
        <label class="field">Weight
          <select class="select" id="fw"><option value="400">Regular</option><option value="600" selected>Semibold</option><option value="800">Bold</option></select>
        </label>
      </div>
      <div class="field"><span>Format</span>
        <div class="seg" id="fmt" role="group" aria-label="Format">
          <button aria-pressed="true" data-v="png">PNG</button>
          <button aria-pressed="false" data-v="jpeg">JPG</button>
          <button aria-pressed="false" data-v="webp">WebP</button>
          <button aria-pressed="false" data-v="svg">SVG</button>
        </div>
      </div>
      <div class="row">
        <button class="btn primary" id="dl"><svg class="i"><use href="#i-download"/></svg>Download</button>
        <button class="btn" id="copyUri"><svg class="i"><use href="#i-copy"/></svg>Copy data URI</button>
        <button class="btn ghost" id="copyTag">Copy &lt;img&gt;</button>
      </div>
    </section>

    <section class="card stack">
      <div class="row between">
        <h2>Preview</h2>
        <span class="chip" id="info">—</span>
      </div>
      <div class="ph-stage checker" id="stage"><canvas id="cv" aria-label="Placeholder preview"></canvas></div>
      <div class="stats" id="stats"></div>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
